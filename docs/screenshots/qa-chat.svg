<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" font-family="Lora, serif">
  <rect x="0" y="0" width="640" height="580" rx="4" fill="#F3F2F2" stroke="#D1D0D0" stroke-width="1"/>

  <rect x="492" y="16" width="132" height="24" rx="3" fill="#EAE9E9"/>
  <text x="558" y="32" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#5F5E5D">ILLUSTRATIVE MOCKUP</text>

  <text x="24" y="36" font-size="11" letter-spacing="1" fill="#949393">NATURAL-LANGUAGE Q&amp;A</text>

  <!-- user question bubble (right-aligned, multi-part question) -->
  <rect x="140" y="56" width="476" height="100" rx="6" fill="#F0E4D0"/>
  <text x="600" y="80" text-anchor="end" font-size="15" fill="#201F1D">How has Company X's revenue and margin trended over the</text>
  <text x="600" y="102" text-anchor="end" font-size="15" fill="#201F1D">last three years, and how does its leverage compare with</text>
  <text x="600" y="124" text-anchor="end" font-size="15" fill="#201F1D">Company Y and Company Z?</text>

  <!-- agent answer bubble (left-aligned, structured multi-part answer) -->
  <rect x="24" y="176" width="480" height="250" rx="6" fill="#FAF9F7" stroke="#D1D0D0" stroke-width="1"/>

  <text x="44" y="204" font-size="12" font-weight="700" letter-spacing="0.5" fill="#5F5E5D">REVENUE &amp; MARGIN — FY2023 TO FY2025</text>
  <text x="44" y="226" font-size="14" fill="#201F1D">Revenue grew from $76.4B to $86.7B to $96.2B —</text>
  <text x="44" y="246" font-size="14" fill="#201F1D">a <tspan font-weight="700">12.2%</tspan> three-year CAGR. Operating margin expanded</text>
  <text x="44" y="266" font-size="14" fill="#201F1D">from 26.1% to 29.8% to <tspan font-weight="700">31.5%</tspan>, a 5.4-point</text>
  <text x="44" y="286" font-size="14" fill="#201F1D">gain driven mainly by cost of revenue growing</text>
  <text x="44" y="306" font-size="14" fill="#201F1D">slower than sales.</text>

  <text x="44" y="336" font-size="12" font-weight="700" letter-spacing="0.5" fill="#5F5E5D">LEVERAGE VS. PEERS</text>
  <text x="44" y="358" font-size="14" fill="#201F1D">Company X's debt-to-equity is <tspan font-weight="700">0.42x</tspan>, versus</text>
  <text x="44" y="378" font-size="14" fill="#201F1D"><tspan font-weight="700">0.68x</tspan> for Company Y and <tspan font-weight="700">0.81x</tspan> for Company Z —</text>
  <text x="44" y="398" font-size="14" fill="#201F1D">the most conservative balance sheet of the three.</text>

  <!-- verified chip -->
  <rect x="24" y="442" width="118" height="30" rx="3" fill="#EAF2E1"/>
  <path d="M 40 457 l 6 6 l 11 -12" fill="none" stroke="#3D5A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="462" font-size="13" font-weight="600" fill="#3D5A1F">Verified</text>

  <text x="150" y="462" font-size="12" fill="#949393">all 6 figures re-checked against source data before display</text>

  <!-- input row -->
  <rect x="24" y="506" width="592" height="40" rx="4" fill="#FAF9F7" stroke="#D1D0D0" stroke-width="1"/>
  <text x="44" y="531" font-size="13" fill="#949393">Ask about revenue, margins, cash flow, peers...</text>
  <circle cx="590" cy="526" r="14" fill="#B68235"/>
  <path d="M 585 526 l 10 0 M 591 521 l 5 5 l -5 5" fill="none" stroke="#FAF9F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

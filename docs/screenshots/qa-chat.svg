<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="580" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>

  <!-- mockup badge -->
  <rect x="492" y="16" width="132" height="24" rx="12" fill="#f0efec"/>
  <text x="558" y="32" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#898781">ILLUSTRATIVE MOCKUP</text>

  <text x="24" y="36" font-size="12" letter-spacing="1" fill="#898781">NATURAL-LANGUAGE Q&amp;A</text>

  <!-- user question bubble (right-aligned, multi-part question) -->
  <rect x="140" y="56" width="476" height="100" rx="16" fill="#cde2fb"/>
  <text x="600" y="80" text-anchor="end" font-size="15" fill="#0b0b0b">How has Company X's revenue and margin trended over the</text>
  <text x="600" y="102" text-anchor="end" font-size="15" fill="#0b0b0b">last three years, and how does its leverage compare with</text>
  <text x="600" y="124" text-anchor="end" font-size="15" fill="#0b0b0b">Company Y and Company Z?</text>

  <!-- agent answer bubble (left-aligned, structured multi-part answer) -->
  <rect x="24" y="176" width="480" height="250" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>

  <text x="44" y="204" font-size="13" font-weight="700" fill="#52514e">REVENUE &amp; MARGIN — FY2023 TO FY2025</text>
  <text x="44" y="226" font-size="14" fill="#0b0b0b">Revenue grew from $76.4B to $86.7B to $96.2B —</text>
  <text x="44" y="246" font-size="14" fill="#0b0b0b">a <tspan font-weight="700">12.2%</tspan> three-year CAGR. Operating margin expanded</text>
  <text x="44" y="266" font-size="14" fill="#0b0b0b">from 26.1% to 29.8% to <tspan font-weight="700">31.5%</tspan>, a 5.4-point</text>
  <text x="44" y="286" font-size="14" fill="#0b0b0b">gain driven mainly by cost of revenue growing</text>
  <text x="44" y="306" font-size="14" fill="#0b0b0b">slower than sales.</text>

  <text x="44" y="336" font-size="13" font-weight="700" fill="#52514e">LEVERAGE VS. PEERS</text>
  <text x="44" y="358" font-size="14" fill="#0b0b0b">Company X's debt-to-equity is <tspan font-weight="700">0.42x</tspan>, versus</text>
  <text x="44" y="378" font-size="14" fill="#0b0b0b"><tspan font-weight="700">0.68x</tspan> for Company Y and <tspan font-weight="700">0.81x</tspan> for Company Z —</text>
  <text x="44" y="398" font-size="14" fill="#0b0b0b">the most conservative balance sheet of the three.</text>

  <!-- verified chip -->
  <rect x="24" y="442" width="118" height="30" rx="15" fill="#e3f6e3"/>
  <path d="M 40 457 l 6 6 l 11 -12" fill="none" stroke="#0ca30c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="462" font-size="13" font-weight="600" fill="#0b6b0b">Verified</text>

  <text x="150" y="462" font-size="12" fill="#898781">all 6 figures re-checked against source data before display</text>

  <!-- input row -->
  <rect x="24" y="506" width="592" height="40" rx="20" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="44" y="531" font-size="13" fill="#898781">Ask about revenue, margins, cash flow, peers...</text>
  <circle cx="590" cy="526" r="14" fill="#2a78d6"/>
  <path d="M 585 526 l 10 0 M 591 521 l 5 5 l -5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>

  <rect x="492" y="16" width="132" height="24" rx="12" fill="#f0efec"/>
  <text x="558" y="32" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#898781">ILLUSTRATIVE MOCKUP</text>

  <text x="24" y="40" font-size="16" font-weight="700" fill="#0b0b0b">Audit Log</text>
  <text x="24" y="60" font-size="12" fill="#898781">A traceable record of every question, answer, and verification outcome</text>

  <!-- table header -->
  <rect x="24" y="84" width="592" height="32" fill="#f0efec"/>
  <text x="40" y="105" font-size="12" font-weight="600" fill="#52514e">TIMESTAMP</text>
  <text x="176" y="105" font-size="12" font-weight="600" fill="#52514e">QUESTION</text>
  <text x="430" y="105" font-size="12" font-weight="600" fill="#52514e">OUTCOME</text>

  <g>
    <line x1="24" y1="116" x2="616" y2="116" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="140" font-size="12" fill="#52514e">09:14:02</text>
    <text x="176" y="140" font-size="12" fill="#0b0b0b">"Operating margin trend, last 3 years?"</text>
    <rect x="430" y="124" width="100" height="24" rx="12" fill="#e3f6e3"/>
    <text x="480" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#0b6b0b">Verified</text>
  </g>

  <g>
    <line x1="24" y1="156" x2="616" y2="156" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="180" font-size="12" fill="#52514e">09:16:47</text>
    <text x="176" y="180" font-size="12" fill="#0b0b0b">"Revenue growth vs. closest peers?"</text>
    <rect x="430" y="164" width="100" height="24" rx="12" fill="#e3f6e3"/>
    <text x="480" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#0b6b0b">Verified</text>
  </g>

  <g>
    <line x1="24" y1="196" x2="616" y2="196" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="220" font-size="12" fill="#52514e">09:21:33</text>
    <text x="176" y="220" font-size="12" fill="#0b0b0b">"Free cash flow decline this year?"</text>
    <rect x="430" y="204" width="122" height="24" rx="12" fill="#fef3d9"/>
    <text x="491" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#a16a00">Unverifiable</text>
  </g>

  <g>
    <line x1="24" y1="236" x2="616" y2="236" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="260" font-size="12" fill="#52514e">09:28:11</text>
    <text x="176" y="260" font-size="12" fill="#0b0b0b">"Debt load vs. industry average?"</text>
    <rect x="430" y="244" width="100" height="24" rx="12" fill="#e3f6e3"/>
    <text x="480" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#0b6b0b">Verified</text>
  </g>

  <g>
    <line x1="24" y1="276" x2="616" y2="276" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="300" font-size="12" fill="#52514e">09:34:52</text>
    <text x="176" y="300" font-size="12" fill="#0b0b0b">"Gross margin, FY2023 vs FY2025?"</text>
    <rect x="430" y="284" width="128" height="24" rx="12" fill="#fdece3"/>
    <text x="494" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#a13d10">Contradicted</text>
  </g>

  <!-- footer -->
  <rect x="24" y="326" width="592" height="46" rx="10" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1"/>
  <text x="40" y="354" font-size="12" fill="#52514e">Every entry links back to the source data used to verify it — nothing is dropped silently.</text>
</svg>

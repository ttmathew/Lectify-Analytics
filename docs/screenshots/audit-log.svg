<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lora, serif">
  <rect x="0" y="0" width="640" height="400" rx="4" fill="#F3F2F2" stroke="#D1D0D0" stroke-width="1"/>


  <text x="24" y="40" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="600" fill="#201F1D">Audit Log</text>
  <text x="24" y="60" font-size="12" fill="#5F5E5D">A traceable record of every question, answer, and verification outcome</text>

  <!-- table header -->
  <rect x="24" y="84" width="592" height="32" fill="#EAE9E9"/>
  <text x="40" y="105" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">TIME</text>
  <text x="110" y="105" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">COMPANY</text>
  <text x="210" y="105" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">QUESTION</text>
  <text x="470" y="105" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">OUTCOME</text>

  <g>
    <line x1="24" y1="116" x2="616" y2="116" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="140" font-size="12" fill="#5F5E5D">09:14:02</text>
    <text x="110" y="140" font-size="12" fill="#201F1D">Company X</text>
    <text x="210" y="140" font-size="12" fill="#201F1D">"Operating margin trend, 3 years?"</text>
    <rect x="470" y="124" width="90" height="24" rx="3" fill="#EAF2E1"/>
    <text x="515" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#3D5A1F">Verified</text>
  </g>

  <g>
    <line x1="24" y1="156" x2="616" y2="156" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="180" font-size="12" fill="#5F5E5D">09:16:47</text>
    <text x="110" y="180" font-size="12" fill="#201F1D">Company Y</text>
    <text x="210" y="180" font-size="12" fill="#201F1D">"Revenue growth vs. peers?"</text>
    <rect x="470" y="164" width="90" height="24" rx="3" fill="#EAF2E1"/>
    <text x="515" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#3D5A1F">Verified</text>
  </g>

  <g>
    <line x1="24" y1="196" x2="616" y2="196" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="220" font-size="12" fill="#5F5E5D">09:21:33</text>
    <text x="110" y="220" font-size="12" fill="#201F1D">Company X</text>
    <text x="210" y="220" font-size="12" fill="#201F1D">"Free cash flow decline this year?"</text>
    <rect x="470" y="204" width="112" height="24" rx="3" fill="#FFF3E4"/>
    <text x="526" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#5A3B0A">Unverifiable</text>
  </g>

  <g>
    <line x1="24" y1="236" x2="616" y2="236" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="260" font-size="12" fill="#5F5E5D">09:28:11</text>
    <text x="110" y="260" font-size="12" fill="#201F1D">Company Z</text>
    <text x="210" y="260" font-size="12" fill="#201F1D">"Debt load vs. industry average?"</text>
    <rect x="470" y="244" width="90" height="24" rx="3" fill="#EAF2E1"/>
    <text x="515" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#3D5A1F">Verified</text>
  </g>

  <g>
    <line x1="24" y1="276" x2="616" y2="276" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="300" font-size="12" fill="#5F5E5D">09:34:52</text>
    <text x="110" y="300" font-size="12" fill="#201F1D">Company X</text>
    <text x="210" y="300" font-size="12" fill="#201F1D">"Gross margin, FY2023 vs FY2025?"</text>
    <rect x="470" y="284" width="116" height="24" rx="3" fill="#FBEAE6"/>
    <text x="528" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#7A3420">Contradicted</text>
  </g>

  <!-- footer -->
  <rect x="24" y="326" width="592" height="46" rx="4" fill="#FAF9F7" stroke="#D1D0D0" stroke-width="1"/>
  <text x="40" y="354" font-size="12" fill="#5F5E5D">Every entry links back to the source data used to verify it — nothing is dropped silently.</text>
</svg>

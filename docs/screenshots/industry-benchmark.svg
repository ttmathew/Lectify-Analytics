<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lora, serif">
  <rect x="0" y="0" width="640" height="400" rx="4" fill="#F3F2F2" stroke="#D1D0D0" stroke-width="1"/>

  <text x="24" y="40" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="600" fill="#201F1D">Gross Margin — Industry Benchmark</text>
  <text x="24" y="58" font-size="12" fill="#5F5E5D">Fiscal Year 2025 · compared against the whole industry, not just hand-picked peers</text>

  <!-- percentile badge -->
  <rect x="452" y="24" width="164" height="28" rx="3" fill="#F0E4D0"/>
  <text x="534" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#5A3B0A">68th percentile</text>

  <!-- chart card -->
  <rect x="24" y="80" width="592" height="170" rx="4" fill="#FAF9F7" stroke="#D1D0D0" stroke-width="1"/>

  <!-- whisker (min to max) -->
  <line x1="64" y1="190" x2="576" y2="190" stroke="#B9B7B1" stroke-width="1.5"/>
  <line x1="64" y1="182" x2="64" y2="198" stroke="#B9B7B1" stroke-width="1.5"/>
  <line x1="576" y1="182" x2="576" y2="198" stroke="#B9B7B1" stroke-width="1.5"/>

  <!-- box: 25th-75th percentile range -->
  <rect x="161" y="168" width="280" height="44" rx="3" fill="#E3D7BE" stroke="#B68235" stroke-width="1.5"/>
  <line x1="271" y1="168" x2="271" y2="212" stroke="#201F1D" stroke-width="2"/>

  <!-- company marker -->
  <text x="357" y="150" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" fill="#201F1D">Company X · 52%</text>
  <circle cx="357" cy="190" r="8" fill="#B68235" stroke="#FAF9F7" stroke-width="2"/>

  <!-- axis labels -->
  <text x="64" y="232" font-size="12" fill="#5F5E5D">28% (industry low)</text>
  <text x="271" y="232" text-anchor="middle" font-size="12" fill="#5F5E5D">45% (industry median)</text>
  <text x="576" y="232" text-anchor="end" font-size="12" fill="#5F5E5D">70% (industry high)</text>

  <!-- legend -->
  <circle cx="31" cy="271" r="7" fill="#B68235" stroke="#FAF9F7" stroke-width="1.5"/>
  <text x="44" y="276" font-size="12" fill="#5F5E5D">Company being analyzed (Company X)</text>
  <rect x="320" y="264" width="14" height="14" rx="2" fill="#E3D7BE" stroke="#B68235" stroke-width="1"/>
  <text x="340" y="275" font-size="12" fill="#5F5E5D">Middle 50% of the industry</text>

  <!-- footer -->
  <rect x="24" y="292" width="592" height="76" rx="4" fill="#FAF9F7" stroke="#D1D0D0" stroke-width="1"/>
  <text x="40" y="316" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="600" fill="#201F1D">Why this is different from peer comparison</text>
  <text x="40" y="334" font-size="12" fill="#5F5E5D">Percentile is calculated across every company classified in the same</text>
  <text x="40" y="350" font-size="12" fill="#5F5E5D">industry — not just the peers you name.</text>
</svg>

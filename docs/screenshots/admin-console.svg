<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Lora, serif">
  <rect x="0" y="0" width="640" height="400" rx="4" fill="#F3F2F2" stroke="#D1D0D0" stroke-width="1"/>

  <rect x="492" y="16" width="132" height="24" rx="3" fill="#EAE9E9"/>
  <text x="558" y="32" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#5F5E5D">ILLUSTRATIVE MOCKUP</text>

  <text x="24" y="40" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="600" fill="#201F1D">Admin Console — User Management</text>
  <text x="24" y="60" font-size="12" fill="#5F5E5D">Roles, per-company data access, and system-level administration</text>

  <!-- table header -->
  <rect x="24" y="84" width="592" height="34" fill="#EAE9E9"/>
  <text x="40" y="106" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">USER</text>
  <text x="210" y="106" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">ROLE</text>
  <text x="300" y="106" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">ACCESS</text>
  <text x="480" y="106" font-size="11" letter-spacing="0.5" font-weight="600" fill="#5F5E5D">STATUS</text>

  <!-- row 1 -->
  <g>
    <line x1="24" y1="118" x2="616" y2="118" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="142" font-size="13" fill="#201F1D">Analyst One</text>
    <text x="210" y="142" font-size="13" fill="#5F5E5D">Analyst</text>
    <text x="300" y="142" font-size="13" fill="#5F5E5D">Company X, Y</text>
    <rect x="480" y="126" width="86" height="22" rx="3" fill="#EAF2E1"/>
    <path d="M 489 137 l 4 4 l 8 -9" fill="none" stroke="#3D5A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="141" font-size="11" font-weight="600" fill="#3D5A1F">Active</text>
  </g>

  <!-- row 2 -->
  <g>
    <line x1="24" y1="158" x2="616" y2="158" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="182" font-size="13" fill="#201F1D">Ops Admin</text>
    <text x="210" y="182" font-size="13" fill="#5F5E5D">Admin</text>
    <text x="300" y="182" font-size="13" fill="#5F5E5D">All companies</text>
    <rect x="480" y="166" width="86" height="22" rx="3" fill="#EAF2E1"/>
    <path d="M 489 177 l 4 4 l 8 -9" fill="none" stroke="#3D5A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="181" font-size="11" font-weight="600" fill="#3D5A1F">Active</text>
  </g>

  <!-- row 3 -->
  <g>
    <line x1="24" y1="198" x2="616" y2="198" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="222" font-size="13" fill="#201F1D">Guest Reviewer</text>
    <text x="210" y="222" font-size="13" fill="#5F5E5D">Viewer</text>
    <text x="300" y="222" font-size="13" fill="#5F5E5D">Company Z</text>
    <rect x="480" y="206" width="104" height="22" rx="3" fill="#FFF3E4"/>
    <circle cx="493" cy="217" r="5" fill="none" stroke="#5A3B0A" stroke-width="1.6"/>
    <path d="M 493 214 l 0 3 l 2 2" fill="none" stroke="#5A3B0A" stroke-width="1.4" stroke-linecap="round"/>
    <text x="508" y="221" font-size="11" font-weight="600" fill="#5A3B0A">Pending</text>
  </g>

  <!-- row 4 -->
  <g>
    <line x1="24" y1="238" x2="616" y2="238" stroke="#D1D0D0" stroke-width="1"/>
    <text x="40" y="262" font-size="13" fill="#949393">Former Contractor</text>
    <text x="210" y="262" font-size="13" fill="#949393">Analyst</text>
    <text x="300" y="262" font-size="13" fill="#949393">Company X</text>
    <rect x="480" y="246" width="96" height="22" rx="3" fill="#F8F4F4"/>
    <path d="M 489 257 l 8 0 M 489 253 l 8 8 M 497 253 l -8 8" fill="none" stroke="#444141" stroke-width="1.4" stroke-linecap="round"/>
    <text x="509" y="261" font-size="11" font-weight="600" fill="#444141">Revoked</text>
  </g>

  <!-- footer note -->
  <rect x="24" y="326" width="592" height="46" rx="4" fill="#FAF9F7" stroke="#D1D0D0" stroke-width="1"/>
  <text x="40" y="346" font-size="12" fill="#5F5E5D">Role-based permissions control who can query, generate reports, or manage users.</text>
  <text x="40" y="362" font-size="12" fill="#5F5E5D">Access can also be scoped per company, as shown in the Access column above.</text>
</svg>

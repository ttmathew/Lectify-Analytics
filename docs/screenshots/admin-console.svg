<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>

  <rect x="492" y="16" width="132" height="24" rx="12" fill="#f0efec"/>
  <text x="558" y="32" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#898781">ILLUSTRATIVE MOCKUP</text>

  <text x="24" y="40" font-size="16" font-weight="700" fill="#0b0b0b">Admin Console — User Management</text>
  <text x="24" y="60" font-size="12" fill="#898781">Roles, per-company data access, and system-level administration</text>

  <!-- table header -->
  <rect x="24" y="84" width="592" height="34" fill="#f0efec"/>
  <text x="40" y="106" font-size="12" font-weight="600" fill="#52514e">USER</text>
  <text x="210" y="106" font-size="12" font-weight="600" fill="#52514e">ROLE</text>
  <text x="300" y="106" font-size="12" font-weight="600" fill="#52514e">ACCESS</text>
  <text x="480" y="106" font-size="12" font-weight="600" fill="#52514e">STATUS</text>

  <!-- row 1 -->
  <g>
    <line x1="24" y1="118" x2="616" y2="118" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="142" font-size="13" fill="#0b0b0b">Analyst One</text>
    <text x="210" y="142" font-size="13" fill="#52514e">Analyst</text>
    <text x="300" y="142" font-size="13" fill="#52514e">Company X, Y</text>
    <rect x="480" y="126" width="86" height="22" rx="11" fill="#e3f6e3"/>
    <path d="M 489 137 l 4 4 l 8 -9" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="141" font-size="11" font-weight="600" fill="#0b6b0b">Active</text>
  </g>

  <!-- row 2 -->
  <g>
    <line x1="24" y1="158" x2="616" y2="158" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="182" font-size="13" fill="#0b0b0b">Ops Admin</text>
    <text x="210" y="182" font-size="13" fill="#52514e">Admin</text>
    <text x="300" y="182" font-size="13" fill="#52514e">All companies</text>
    <rect x="480" y="166" width="86" height="22" rx="11" fill="#e3f6e3"/>
    <path d="M 489 177 l 4 4 l 8 -9" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="181" font-size="11" font-weight="600" fill="#0b6b0b">Active</text>
  </g>

  <!-- row 3 -->
  <g>
    <line x1="24" y1="198" x2="616" y2="198" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="222" font-size="13" fill="#0b0b0b">Guest Reviewer</text>
    <text x="210" y="222" font-size="13" fill="#52514e">Viewer</text>
    <text x="300" y="222" font-size="13" fill="#52514e">Company Z</text>
    <rect x="480" y="206" width="104" height="22" rx="11" fill="#fef3d9"/>
    <circle cx="493" cy="217" r="5" fill="none" stroke="#a16a00" stroke-width="1.6"/>
    <path d="M 493 214 l 0 3 l 2 2" fill="none" stroke="#a16a00" stroke-width="1.4" stroke-linecap="round"/>
    <text x="508" y="221" font-size="11" font-weight="600" fill="#a16a00">Pending</text>
  </g>

  <!-- row 4 -->
  <g>
    <line x1="24" y1="238" x2="616" y2="238" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="262" font-size="13" fill="#898781">Former Contractor</text>
    <text x="210" y="262" font-size="13" fill="#898781">Analyst</text>
    <text x="300" y="262" font-size="13" fill="#898781">Company X</text>
    <rect x="480" y="246" width="96" height="22" rx="11" fill="#f0efec"/>
    <path d="M 489 257 l 8 0 M 489 253 l 8 8 M 497 253 l -8 8" fill="none" stroke="#898781" stroke-width="1.4" stroke-linecap="round"/>
    <text x="509" y="261" font-size="11" font-weight="600" fill="#52514e">Revoked</text>
  </g>

  <!-- footer note -->
  <rect x="24" y="326" width="592" height="46" rx="10" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1"/>
  <text x="40" y="346" font-size="12" fill="#52514e">Role-based permissions control who can query, generate reports, or manage users.</text>
  <text x="40" y="362" font-size="12" fill="#52514e">Access can also be scoped per company, as shown in the Access column above.</text>
</svg>

  <text x="40" y="140" font-size="26" font-weight="700" fill="#0b0b0b">3.2</text>
  <rect x="40" y="150" width="140" height="20" rx="10" fill="#e3f6e3"/>
  <text x="52" y="164" font-size="11" fill="#0b6b0b">-0.4 vs. last week</text>

  <rect x="228" y="84" width="184" height="96" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="244" y="108" font-size="12" fill="#898781">REDUNDANT CALLS</text>

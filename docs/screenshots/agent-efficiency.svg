  <text x="24" y="210" font-size="13" font-weight="600" fill="#0b0b0b">Tool-call trace — flagged example</text>
  <text x="24" y="228" font-size="11" fill="#898781">Example: one multi-part question's tool-call sequence</text>

  <!-- flagged tag above box 2 -->
  <rect x="142" y="234" width="100" height="16" rx="8" fill="#fef3d9"/>

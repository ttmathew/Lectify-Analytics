  <line x1="126" y1="284" x2="136" y2="284" stroke="#c3c2b7" stroke-width="1.5"/>
  <polygon points="136,279 136,289 142,284" fill="#c3c2b7"/>
  <line x1="244" y1="284" x2="254" y2="284" stroke="#c3c2b7" stroke-width="1.5"/>
  <polygon points="254,279 254,289 260,284" fill="#c3c2b7"/>
  <line x1="362" y1="284" x2="372" y2="284" stroke="#c3c2b7" stroke-width="1.5"/>
  <polygon points="372,279 372,289 378,284" fill="#c3c2b7"/>
  <line x1="480" y1="284" x2="490" y2="284" stroke="#c3c2b7" stroke-width="1.5"/>
  <polygon points="490,279 490,289 496,284" fill="#c3c2b7"/>

  <!-- calls by tool -->
  <text x="24" y="364" font-size="13" font-weight="600" fill="#0b0b0b">Calls by tool — last 7 days</text>

  <text x="170" y="401" text-anchor="end" font-size="12" fill="#52514e">Fetch metrics</text>
  <rect x="180" y="384" width="410" height="24" rx="4" fill="#2a78d6"/>
  <text x="582" y="401" text-anchor="end" font-size="12" font-weight="600" fill="#ffffff">156</text>

  <text x="170" y="445" text-anchor="end" font-size="12" fill="#52514e">Verify claims</text>

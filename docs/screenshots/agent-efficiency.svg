  <!-- box 2 (flagged duplicate) -->
  <rect x="142" y="256" width="100" height="56" rx="8" fill="#fef3d9" stroke="#a16a00" stroke-width="1.5"/>
  <text x="192" y="278" text-anchor="middle" font-size="11" fill="#7a5100">Fetch</text>
  <text x="192" y="296" text-anchor="middle" font-size="11" fill="#7a5100">metrics</text>

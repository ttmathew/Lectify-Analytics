  <rect x="378" y="256" width="100" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="428" y="278" text-anchor="middle" font-size="11" fill="#0b0b0b">Search</text>
  <text x="428" y="296" text-anchor="middle" font-size="11" fill="#0b0b0b">narrative</text>
  <text x="428" y="328" text-anchor="middle" font-size="11" fill="#898781">0.3s</text>

  <!-- box 5 -->
  <rect x="496" y="256" width="100" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="546" y="278" text-anchor="middle" font-size="11" fill="#0b0b0b">Verify</text>
  <text x="546" y="296" text-anchor="middle" font-size="11" fill="#0b0b0b">claims</text>
  <text x="546" y="328" text-anchor="middle" font-size="11" fill="#898781">0.5s</text>


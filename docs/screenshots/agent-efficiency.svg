  <rect x="180" y="472" width="258" height="24" rx="4" fill="#9ec5f4"/>
  <text x="446" y="489" font-size="12" fill="#52514e">98</text>

  <text x="170" y="533" text-anchor="end" font-size="12" fill="#52514e">Search narrative</text>
  <rect x="180" y="516" width="229" height="24" rx="4" fill="#9ec5f4"/>
  <text x="417" y="533" font-size="12" fill="#52514e">87</text>

  <!-- alert callout -->
  <rect x="24" y="568" width="592" height="40" rx="10" fill="#fef3d9"/>
  <polygon points="47,575 40,588 54,588" fill="none" stroke="#a16a00" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="47" y1="579" x2="47" y2="583" stroke="#a16a00" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="47" cy="586" r="0.9" fill="#a16a00"/>
  <text x="64" y="592" font-size="12" fill="#a16a00">Redundant-retrieval pattern detected 12 times this week — flagged for review.</text>
</svg>

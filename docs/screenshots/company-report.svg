<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>

  <rect x="492" y="16" width="132" height="24" rx="12" fill="#f0efec"/>
  <text x="558" y="32" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#898781">ILLUSTRATIVE MOCKUP</text>

  <text x="24" y="40" font-size="18" font-weight="700" fill="#0b0b0b">Company Report — Company X</text>
  <text x="24" y="60" font-size="13" fill="#898781">Fiscal Year 2025 · Performance, peer &amp; industry comparison, drivers of change</text>

  <!-- stat tiles -->
  <g>
    <rect x="24" y="84" width="180" height="96" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
    <text x="40" y="108" font-size="12" fill="#898781">REVENUE</text>
    <text x="40" y="140" font-size="26" font-weight="700" fill="#0b0b0b">$96.2B</text>
    <rect x="40" y="150" width="62" height="20" rx="10" fill="#e3f6e3"/>
    <text x="71" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#0b6b0b">▲ 6.1%</text>
  </g>

  <g>
    <rect x="216" y="84" width="180" height="96" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
    <text x="232" y="108" font-size="12" fill="#898781">OPERATING MARGIN</text>
    <text x="232" y="140" font-size="26" font-weight="700" fill="#0b0b0b">31.5%</text>
    <rect x="232" y="150" width="82" height="20" rx="10" fill="#e3f6e3"/>
    <text x="273" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#0b6b0b">▲ 1.7 pts</text>
  </g>

  <g>
    <rect x="408" y="84" width="208" height="96" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
    <text x="424" y="108" font-size="12" fill="#898781">FREE CASH FLOW</text>
    <text x="424" y="140" font-size="26" font-weight="700" fill="#0b0b0b">$99.6B</text>
    <rect x="424" y="150" width="66" height="20" rx="10" fill="#fdece3"/>
    <text x="457" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#a13d10">▼ 3.2%</text>
  </g>

  <!-- revenue trend mini chart -->
  <text x="24" y="210" font-size="13" font-weight="600" fill="#0b0b0b">Revenue trend</text>
  <g>
    <line x1="24" y1="290" x2="616" y2="290" stroke="#c3c2b7" stroke-width="1"/>
    <rect x="44" y="250" width="48" height="40" rx="4" fill="#cde2fb"/>
    <rect x="132" y="230" width="48" height="60" rx="4" fill="#9ec5f4"/>
    <rect x="220" y="205" width="48" height="85" rx="4" fill="#5598e7"/>
    <rect x="308" y="180" width="48" height="110" rx="4" fill="#2a78d6"/>
    <rect x="396" y="160" width="48" height="130" rx="4" fill="#184f95"/>
    <text x="68" y="304" text-anchor="middle" font-size="11" fill="#898781">FY21</text>
    <text x="156" y="304" text-anchor="middle" font-size="11" fill="#898781">FY22</text>
    <text x="244" y="304" text-anchor="middle" font-size="11" fill="#898781">FY23</text>
    <text x="332" y="304" text-anchor="middle" font-size="11" fill="#898781">FY24</text>
    <text x="420" y="304" text-anchor="middle" font-size="11" fill="#898781">FY25</text>
  </g>

  <!-- narrative section -->
  <rect x="24" y="326" width="592" height="54" rx="10" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1"/>
  <text x="40" y="348" font-size="12" font-weight="600" fill="#0b0b0b">Drivers of change</text>
  <text x="40" y="366" font-size="12" fill="#52514e">Margin expansion attributed to disciplined cost of revenue growth versus sales — grounded in the company's own disclosures.</text>
</svg>
